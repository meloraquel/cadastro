<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            color: #333;
        }

        .site-header {
            background-color: #0056b3;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            padding: 16px 30px;
        }

        .site-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .site-nav a {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        .site-nav a:hover {
            text-decoration: underline;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .table-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 1000px;
            overflow-x: auto;
            padding: 30px;
            width: 100%;
        }

        h2 {
            color: #0056b3;
            margin-bottom: 20px;
            text-align: center;
        }

        .table {
            border-collapse: collapse;
            min-width: 700px;
            width: 100%;
        }

        .table th,
        .table td {
            border-bottom: 1px solid #dfe5e3;
            padding: 14px 12px;
            text-align: left;
        }

        .table th {
            background-color: #0056b3;
            color: #ffffff;
            font-size: 14px;
        }

        .table th:first-child {
            border-radius: 4px 0 0 0;
        }

        .table th:last-child {
            border-radius: 0 4px 0 0;
        }

        .table tbody tr:hover {
            background-color: #f4f7f6;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-button {
            border: none;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 12px;
        }

        .modify-button {
            background-color: #0056b3;
        }

        .modify-button:hover {
            background-color: #004085;
        }

        .delete-button {
            background-color: #dc3545;
        }

        .delete-button:hover {
            background-color: #b02a37;
        }

        @media (max-width: 600px) {
            .site-header {
                padding: 16px 20px;
            }

            main {
                padding: 24px 12px;
            }

            .table-container {
                padding: 20px 12px;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="/home/">Home</a>
            <a href="/home/">Cadastro</a>
            <a href="/login/">Login</a>
        </nav>
    </header>

    <main>
        <section class="table-container">
            <h2>Usuários cadastrados</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nome</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Senha</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for usuario in usuarios %}
                    <tr>
                        <td>{{ usuario.id }}</td>
                        <td>{{ usuario.nome }}</td>
                        <td>{{ usuario.email }}</td>
                        <td>{{ usuario.senha }}</td>
                        <td>
                            <div class="actions">
                                <button class="action-button modify-button" type="button">Modificar</button>
                                <button class="action-button delete-button" type="button">Excluir</button>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
</html>
